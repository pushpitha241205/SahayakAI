services:
  - type: web
    name: sahayak-ai
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt "pydantic[email]"
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./sahayak_ai.db
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: hybrid
