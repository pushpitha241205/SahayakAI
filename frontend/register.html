<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Sahayak AI</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="container" style="max-width: 480px; margin-top: 2rem;">
    <div class="card">
      <h2 style="font-size: 1.6rem; font-weight: 800; margin-bottom: 0.5rem; text-align: center;">Create Safe Account</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-bottom: 1.5rem;">
        Register your details so responders and trusted contacts can recognize you.
      </p>

      <div id="alert-box" style="display: none; padding: 0.75rem; border-radius: 6px; font-size: 0.9rem; margin-bottom: 1.25rem;"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" class="form-input" placeholder="e.g. Ramesh Kumar" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="e.g. ramesh@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <input type="tel" id="phone" class="form-input" placeholder="e.g. 9876543210" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password (min 6 characters)</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" minlength="6" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" class="form-input" placeholder="••••••••" minlength="6" required>
        </div>

        <button type="submit" id="register-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Complete Registration
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Already registered? <a href="/login.html" style="color: #60a5fa; text-decoration: none; font-weight: 600;">Sign in here</a>
      </div>
    </div>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    const form = document.getElementById("register-form");
    const alertBox = document.getElementById("alert-box");
    const registerBtn = document.getElementById("register-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const confirm_password = document.getElementById("confirm_password").value;

      if (password !== confirm_password) {
        alertBox.style.display = "block";
        alertBox.style.backgroundColor = "rgba(239, 68, 68, 0.2)";
        alertBox.style.border = "1px solid #ef4444";
        alertBox.style.color = "#f87171";
        alertBox.innerText = "Passwords do not match.";
        return;
      }

      registerBtn.disabled = true;
      registerBtn.innerText = "Creating account...";

      try {
        const res = await API.register({ name, email, phone, password, confirm_password });
        Auth.setAuth(res.access_token, res.user);
        window.location.href = "/dashboard.html";
      } catch (err) {
        alertBox.style.display = "block";
        alertBox.style.backgroundColor = "rgba(239, 68, 68, 0.2)";
        alertBox.style.border = "1px solid #ef4444";
        alertBox.style.color = "#f87171";
        alertBox.innerText = err.message || "Registration failed.";
      } finally {
        registerBtn.disabled = false;
        registerBtn.innerText = "Complete Registration";
      }
    });
  </script>
</body>
</html>
